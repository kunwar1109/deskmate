# Runs on every push to main and every pull request. GitHub starts a fresh Ubuntu machine per job.
#
# - checks: typecheck, lint, unit + API tests, widget build. No services, no secrets.
# - e2e:    Playwright against the real API, worker and dashboard, with MongoDB (Atlas Local, which has
#           Vector Search) and Redis as throwaway containers. On pull requests it runs the
#           tests that don't call Gemini; on main it runs all of them with the Gemini key from repo secrets.
# - deploy: on main, after both pass: the API to Render and the dashboard to Vercel, each only if its code changed.
#
# Actions are pinned to a commit, not a tag: a tag can be moved to point at different code later.
name: CI

on:
  push:
    branches: [main]
  pull_request: # from a branch, or a fork: runs the checks before merging

# A newer push to the same branch cancels the run that's still going for the old commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the jobs only read the code.
permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci # exact versions from package-lock.json
      - run: npm run typecheck
      - run: npm run lint -w apps/web
      # API tests start an in-memory MongoDB and fake the AI and the queue; web tests run in jsdom.
      - run: npm test
      - run: npm run build:widget

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # On main, this job and the evals use the same Gemini key: 15 requests a minute on the free tier. Run at
    # once, they pushed each other into 429s (2 flaky tests on 2026-10-29). Sharing a group makes them take turns.
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'gemini-free-tier' || format('e2e-{0}', github.ref) }}
      cancel-in-progress: false
    services:
      mongodb:
        # MongoDB 8.0 with Atlas Search and Vector Search, like the free Atlas tier. Has its own health check,
        # so the job waits until it's ready. A single-node replica set, so signup's transaction works.
        image: mongodb/mongodb-atlas-local:8.0.30-20261013T085210Z
        ports: ['27017:27017']
      redis:
        image: redis:8.10.1-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MONGODB_URI: mongodb://localhost:27017/?directConnection=true
      REDIS_URL: redis://localhost:6379
      # Only main has the real key (pull requests from forks never get secrets). Elsewhere a placeholder
      # passes config validation; the tests run there never call Gemini.
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.GOOGLE_GENERATIVE_AI_API_KEY || 'not-used-outside-main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Session secret for this run only
        run: |
          secret=$(openssl rand -base64 48)
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - name: E2E without Gemini
        if: github.ref != 'refs/heads/main'
        run: npm run test:e2e:fast
      - name: E2E, all tests (Gemini)
        if: github.ref == 'refs/heads/main'
        run: npm run test:e2e
      # On failure: the HTML report with traces (DOM snapshots, network, console per step) to download.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  deploy:
    name: Deploy (Render API, Vercel dashboard)
    needs: [checks, e2e]
    # Only pushes to main, and only after every test above passed. The evals (evals.yml) don't gate this:
    # they're a quality report on a nondeterministic model sharing a free-tier quota, and a 54/56 run
    # shouldn't hold back an unrelated fix.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # to find the last successful run below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, to diff against the last deployed commit
      - name: Deploy what changed since the last successful run
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          # Compare with the last run that got this far, not with the previous push: a newer push cancels an
          # older run (see concurrency), and that older run's changes still need deploying.
          last=$(gh run list --workflow ci.yml --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$last" "$GITHUB_SHA")
          else
            changed=everything # no earlier deploy to compare with
          fi

          deploy() { # name, hook URL, paths that affect it
            if [ -z "$2" ]; then echo "$1: no deploy hook secret set, skipping"; return; fi
            if [ "$changed" != everything ] && ! grep -qE "$3" <<<"$changed"; then echo "$1: unchanged"; return; fi
            echo "$1: deploying"
            curl --fail-with-body -sS -X POST "$2"
            echo
          }
          # Render deploys exactly this commit (ref=), the one the tests just passed. Vercel's hook builds the
          # branch's latest commit, which is this one unless a newer push arrived (and that run deploys again).
          deploy API "${RENDER_DEPLOY_HOOK_URL:+$RENDER_DEPLOY_HOOK_URL&ref=$GITHUB_SHA}" \
            '^(apps/api/src/|apps/api/package\.json|apps/widget/|packages/shared/|package\.json|package-lock\.json|render\.yaml)'
          deploy Dashboard "$VERCEL_DEPLOY_HOOK_URL" \
            '^(apps/web/|packages/shared/|package\.json|package-lock\.json)'
